name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Capacitor deps
        working-directory: android-app
        run: npm install --no-audit --no-fund

      - name: Capacitor sync android
        working-directory: android-app
        run: npx cap sync android

      - name: Restore signing keystore
        working-directory: android-app/android
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p app
          echo "$KEYSTORE_B64" | base64 -d > app/keystore.jks

      - name: Build debug APK
        working-directory: android-app/android
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: discussion-app-debug
          path: android-app/android/app/build/outputs/apk/debug/*.apk
